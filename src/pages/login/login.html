<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 — AniTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ["Fredoka", "sans-serif"],
              body: ["Nunito", "sans-serif"],
            },
            colors: {
              sky: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                400: "#38bdf8",
                500: "#0ea5e9",
                700: "#0369a1",
                900: "#0c4a6e",
              },
              warm: {
                500: "#f97316",
                600: "#ea580c",
              },
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: "Nunito", sans-serif;
      }
      .font-heading {
        font-family: "Fredoka", sans-serif;
      }
      .animate-spin-slow {
        animation: spin 1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-spin-slow {
          animation: none;
        }
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-sky-50 text-sky-900 antialiased min-h-screen">
    <div class="min-h-screen flex">
      <!-- Left: Illustration -->
      <div
        class="hidden lg:block lg:w-1/2 bg-cover bg-center"
        style="background-image: url(&quot;bg.png&quot;)"
        c:\Users\sakura\Desktop\新建文件夹\wallhaven-6oxwpx_1920x1080
        (1).png
        aria-hidden="true"
      ></div>

      <!-- Right: Form -->
      <div
        class="w-full lg:w-1/2 flex items-center justify-center px-4 py-12 relative overflow-hidden"
        style="background: linear-gradient(135deg, #edf4ff 0%, #deeaff 100%)"
      >
        <div class="w-full max-w-sm relative z-10">
          <!-- 登录卡片 -->
          <div
            class="rounded-2xl p-8"
            style="
              background-color: #ffffff;
              box-shadow: 0 4px 24px rgba(23, 32, 51, 0.06);
            "
          >
            <!-- Wordmark -->
            <div class="text-center mb-10">
              <a
                href="/"
                class="font-heading text-2xl font-semibold tracking-tight cursor-pointer transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6] focus-visible:ring-offset-2 rounded inline-block"
                style="color: #172033"
                onmouseover="this.style.color = '#3B82F6'"
                onmouseout="this.style.color = '#172033'"
              >
                AniTrack
              </a>
            </div>

            <!-- Title -->
            <h1
              class="font-heading text-3xl font-bold text-center mb-8"
              style="color: #172033"
            >
              欢迎回来
            </h1>

            <!-- Global error -->
            <div
              id="global-error"
              class="hidden mb-6 rounded-lg px-4 py-3 text-sm"
              style="
                background-color: #fef2f2;
                border: 1px solid #fecaca;
                color: #dc2626;
              "
              role="alert"
            >
              邮箱或密码错误
            </div>

            <form id="login-form" novalidate>
              <!-- Email -->
              <div class="mb-5">
                <label
                  for="email"
                  class="block text-sm font-semibold mb-2"
                  style="color: #172033"
                >
                  邮箱
                </label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="you@example.com"
                  class="w-full px-4 py-3 rounded-lg text-base transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6] focus-visible:ring-offset-2 min-h-[44px]"
                  style="
                    background-color: #f8fafc;
                    border: 1px solid #e2e8f0;
                    color: #172033;
                  "
                  onfocus="this.style.borderColor = '#3B82F6'"
                  onblur="this.style.borderColor = '#E2E8F0'"
                  aria-describedby="email-error"
                />
                <p
                  id="email-error"
                  class="hidden mt-2 text-sm"
                  style="color: #dc2626"
                ></p>
              </div>

              <!-- Password -->
              <div class="mb-6">
                <label
                  for="password"
                  class="block text-sm font-semibold mb-2"
                  style="color: #172033"
                >
                  密码
                </label>
                <div class="relative">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    class="w-full px-4 py-3 pr-12 rounded-lg text-base transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6] focus-visible:ring-offset-2 min-h-[44px]"
                    style="
                      background-color: #f8fafc;
                      border: 1px solid #e2e8f0;
                      color: #172033;
                    "
                    onfocus="this.style.borderColor = '#3B82F6'"
                    onblur="this.style.borderColor = '#E2E8F0'"
                    aria-describedby="password-error"
                  />
                  <button
                    type="button"
                    id="toggle-password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-md transition-colors duration-150 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6]"
                    aria-label="显示密码"
                  >
                    <!-- Eye -->
                    <svg
                      id="icon-eye"
                      class="w-5 h-5"
                      style="color: #94a3b8"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <!-- EyeOff -->
                    <svg
                      id="icon-eyeoff"
                      class="w-5 h-5 hidden"
                      style="color: #94a3b8"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                      <path
                        d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                      />
                      <path
                        d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7c.78 0 1.53-.09 2.24-.26"
                      />
                      <path d="M2 2l20 20" />
                    </svg>
                  </button>
                </div>
                <p
                  id="password-error"
                  class="hidden mt-2 text-sm"
                  style="color: #dc2626"
                ></p>
              </div>

              <!-- Submit -->
              <button
                type="submit"
                id="submit-btn"
                class="w-full flex items-center justify-center gap-2 font-bold text-base px-6 py-3 rounded-lg transition-colors duration-150 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6] focus-visible:ring-offset-2 min-h-[48px]"
                style="background-color: #3b82f6; color: #ffffff"
                onmouseover="this.style.backgroundColor = '#2563EB'"
                onmouseout="this.style.backgroundColor = '#3B82F6'"
              >
                <svg
                  id="loader"
                  class="w-5 h-5 hidden animate-spin-slow"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                </svg>
                <span id="btn-text">登录</span>
              </button>
            </form>

            <!-- Footer links -->
            <div class="mt-8 text-center">
              <p class="text-sm" style="color: #64748b">
                还没有账号？
                <a
                  href="register.html"
                  class="font-semibold transition-colors duration-150 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6] focus-visible:ring-offset-2 rounded"
                  style="color: #172033"
                  onmouseover="this.style.color = '#3B82F6'"
                  onmouseout="this.style.color = '#172033'"
                >
                  免费注册
                </a>
              </p>
              <p class="mt-3 text-sm text-center">
                <a
                  href="index.html"
                  class="transition-colors duration-150 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8B5CF6] focus-visible:ring-offset-2 rounded"
                  style="color: #64748b"
                  onmouseover="this.style.color = '#3B82F6'"
                  onmouseout="this.style.color = '#64748B'"
                >
                  返回首页
                </a>
              </p>
              <!-- TODO: /forgot-password route not implemented yet -->
              <!-- <p class="mt-3 text-sm">
              <a href="/forgot-password" class="text-sky-500 hover:text-sky-700 transition-colors duration-150">忘记密码？</a>
            </p> -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      ;(function () {
        const form = document.getElementById("login-form")
        const emailInput = document.getElementById("email")
        const passwordInput = document.getElementById("password")
        const emailError = document.getElementById("email-error")
        const passwordError = document.getElementById("password-error")
        const globalError = document.getElementById("global-error")
        const submitBtn = document.getElementById("submit-btn")
        const btnText = document.getElementById("btn-text")
        const loader = document.getElementById("loader")
        const toggleBtn = document.getElementById("toggle-password")
        const iconEye = document.getElementById("icon-eye")
        const iconEyeOff = document.getElementById("icon-eyeoff")

        function showError(el, msg) {
          el.textContent = msg
          el.classList.remove("hidden")
          const input = document.querySelector(
            '[aria-describedby="' + el.id + '"]',
          )
          if (input) {
            input.setAttribute("aria-invalid", "true")
            input.classList.add("border-red-300")
            input.classList.remove("border-sky-200")
          }
        }

        function clearError(el) {
          el.classList.add("hidden")
          el.textContent = ""
          const input = document.querySelector(
            '[aria-describedby="' + el.id + '"]',
          )
          if (input) {
            input.setAttribute("aria-invalid", "false")
            input.classList.remove("border-red-300")
            input.classList.add("border-sky-200")
          }
        }

        function validateEmail() {
          const val = emailInput.value.trim()
          if (!val) {
            showError(emailError, "邮箱格式不正确")
            return false
          }
          const at = val.indexOf("@")
          if (
            at < 1 ||
            at === val.length - 1 ||
            val.indexOf(".", at) < at + 2
          ) {
            showError(emailError, "邮箱格式不正确")
            return false
          }
          clearError(emailError)
          return true
        }

        function validatePassword() {
          const val = passwordInput.value
          if (val.length < 8) {
            showError(passwordError, "密码至少 8 位")
            return false
          }
          clearError(passwordError)
          return true
        }

        emailInput.addEventListener("blur", validateEmail)
        passwordInput.addEventListener("blur", validatePassword)

        emailInput.addEventListener("input", function () {
          if (!emailError.classList.contains("hidden")) clearError(emailError)
          globalError.classList.add("hidden")
        })
        passwordInput.addEventListener("input", function () {
          if (!passwordError.classList.contains("hidden"))
            clearError(passwordError)
          globalError.classList.add("hidden")
        })

        toggleBtn.addEventListener("click", function () {
          if (passwordInput.type === "password") {
            passwordInput.type = "text"
            iconEye.classList.add("hidden")
            iconEyeOff.classList.remove("hidden")
            toggleBtn.setAttribute("aria-label", "隐藏密码")
          } else {
            passwordInput.type = "password"
            iconEye.classList.remove("hidden")
            iconEyeOff.classList.add("hidden")
            toggleBtn.setAttribute("aria-label", "显示密码")
          }
        })

        function checkLogin(email, password) {
          const defaultUsers = [{ email: "123@qq.com", password: "12345678" }]
          const stored = JSON.parse(localStorage.getItem("users") || "[]")
          const allUsers = defaultUsers.concat(stored)
          return allUsers.some(function (u) {
            return u.email === email && u.password === password
          })
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault()
          globalError.classList.add("hidden")

          const okEmail = validateEmail()
          const okPassword = validatePassword()
          if (!okEmail || !okPassword) return

          submitBtn.disabled = true
          btnText.textContent = "登录中…"
          loader.classList.remove("hidden")

          setTimeout(function () {
            submitBtn.disabled = false
            btnText.textContent = "登录"
            loader.classList.add("hidden")

            const email = emailInput.value.trim()
            const password = passwordInput.value
            if (checkLogin(email, password)) {
              localStorage.setItem("currentUser", email)
              window.location.href = "index.html"
            } else {
              globalError.classList.remove("hidden")
            }
          }, 1500)
        })
      })()
    </script>
  </body>
</html>
